<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL_V16 // BLINDADO</title>
    <style>
        body { background: #010101; color: #fff; font-family: monospace; margin: 0; padding: 10px; }
        .card { background: #060606; border: 1px solid #222; border-radius: 8px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .sym { font-size: 16px; font-weight: bold; color: #00ff88; }
        .val { font-size: 16px; color: #fff; }
        .tag { font-size: 10px; padding: 3px 6px; border-radius: 4px; background: #111; color: #f59e0b; }
        .error-box { background: #200; border: 1px solid #f00; padding: 8px; margin-bottom: 10px; font-size: 10px; color: #ff8888; }
    </style>
</head>
<body>

<div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; color: #00ff88;">SENTINEL_V16 // MODO DIRETO</div>

<div class="error-box" id="debug-log">Estado: A carregar ativos...</div>

<div id="app-container"></div>

<script>
    const logEl = document.getElementById('debug-log');
    
    window.onerror = function(msg, url, line) {
        logEl.innerHTML = `ERRO JS: ${msg} (Linha: ${line})`;
        return true;
    };

    try {
        const ativos = [
            { s: "BTC", p: 375000 },
            { s: "ETH", p: 18500 },
            { s: "SOL", p: 850 },
            { s: "LINK", p: 75 },
            { s: "STX", p: 12.50 },
            { s: "RENDER", p: 45 }
        ];

        const container = document.getElementById('app-container');
        let html = '';

        ativos.forEach(item => {
            html += `
                <div class="card">
                    <div>
                        <div class="sym">${item.s}</div>
                        <div class="tag">ATIVO</div>
                    </div>
                    <div>
                        <div class="val">R$ ${item.p.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
        logEl.style.display = 'none'; // Esconde se carregar com sucesso
    } catch(e) {
        logEl.innerHTML = "Erro crítico ao montar HTML: " + e.message;
    }
</script>

</body>
</html>
