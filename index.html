<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL_V12 // SOBERANIA TOTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #020202; 
            --card: #0a0a0a; 
            --green-nitido: #00ff88; 
            --red-nitido: #ff3e3e;   
            --border-dark: #1a1a1a; 
            --glass: rgba(5, 5, 5, 0.95);
        }
        body { background: var(--bg); color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

        .st-bar { 
            display: flex; flex-direction: column;
            padding: 20px; border-bottom: 2px solid var(--border-dark); 
            background: var(--glass); backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 1000;
        }
        
        .st-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .st-metrics { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; border-top: 1px solid #111; padding-top: 15px; }
        
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 8px; font-weight: 900; color: #666; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
        .stat-val { font-size: 11px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: #eee; }

        .clock-modern { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 18px; font-weight: 800; 
            color: #fff; text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            background: #111; padding: 5px 12px; border-radius: 6px; border: 1px solid #222;
        }

        .notif-bell { display: flex; align-items: center; gap: 8px; font-size: 9px; font-weight: 900; color: #444; cursor: pointer; position: relative; }
        .bell-dot { width: 8px; height: 8px; background: #ffcc00; border-radius: 50%; position: absolute; top: -4px; right: -4px; display: none; box-shadow: 0 0 10px #ffcc00; }
        
        #notif-panel {
            position: fixed; top: 100px; right: 15px; left: 15px; 
            background: #0d0d0d; border: 1px solid #222; border-radius: 12px;
            padding: 20px; display: none; z-index: 2000; box-shadow: 0 30px 60px rgba(0,0,0,1);
        }
        .notif-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 10px; }
        .notif-item { font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 10px 0; border-bottom: 1px solid #1a1a1a; color: #aaa; }
        
        .panel-actions { display: flex; gap: 10px; align-items: center; }
        .clear-btn { background: #ff3e3e; color: #fff; border: none; padding: 4px 8px; font-size: 8px; font-weight: 900; border-radius: 4px; cursor: pointer; }
        .export-btn { background: #60a5fa; color: #fff; border: none; padding: 4px 8px; font-size: 8px; font-weight: 900; border-radius: 4px; cursor: pointer; }

        .pulse { animation: pulse-glow 2s infinite ease-in-out; }
        @keyframes pulse-glow { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }

        .nav { display: flex; border-bottom: 1px solid var(--border-dark); background: #050505; flex-wrap: wrap; }
        .n-btn { flex: 1; min-width: 25%; padding: 14px; text-align: center; font-size: 9px; font-weight: 900; color: #333; background: none; border: none; letter-spacing: 1px; cursor: pointer; }
        .n-btn.active { color: var(--green-nitido); border-bottom: 3px solid var(--green-nitido); }

        .extra-controls { display: flex; justify-content: space-between; align-items: center; background: #070707; padding: 8px 15px; border-bottom: 1px solid var(--border-dark); font-size: 9px; font-family: 'JetBrains Mono', monospace; color: #777; }
        .extra-controls select, .extra-controls button { background: #111; color: #aaa; border: 1px solid #222; padding: 4px 8px; border-radius: 4px; font-size: 9px; cursor: pointer; }

        .container { padding: 12px; display: flex; flex-direction: column; }
        .c-asset { 
            background: var(--card); border: 1px solid var(--border-dark);
            border-radius: 12px; margin-bottom: 10px; padding: 20px 15px; 
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }

        .side-pill {
            position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: #1a1a1a; transition: all 0.4s ease;
        }

        .asset-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .a-left { display: flex; align-items: center; gap: 12px; }
        .coin-icon { width: 32px; height: 32px; border-radius: 50%; background: #111; border: 1px solid #222; }
        .a-info { display: flex; flex-direction: column; }
        .a-sym { font-size: 22px; font-weight: 900; color: #ffffff; letter-spacing: -1px; line-height: 1; }
        .a-subinfo { display: flex; gap: 8px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
        .a-pair { font-size: 10px; color: #888; font-weight: 900; }
        .rsi-tag { font-size: 10px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: #00ff88; background: rgba(0,255,136,0.15); padding: 2px 6px; border-radius: 4px; }
        .vol-tag { font-size: 10px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: #60a5fa; background: rgba(59,130,246,0.15); padding: 2px 6px; border-radius: 4px; }

        .a-right { text-align: right; }
        .a-price { font-size: 21px; font-weight: 800; color: #ffffff; font-family: 'JetBrains Mono', monospace; cursor: pointer; }
        .a-price:active { opacity: 0.5; }
        
        .status-box { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 6px; }
        .a-pct { font-size: 13px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
        .flow-tag { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; background: #000; border: 1px solid #1a1a1a; color: #333; }

        .chart-box { display: none; width: 100%; height: 450px; margin-top: 15px; border-top: 1px solid var(--border-dark); }
        .c-asset.open .chart-box { display: block; }

        .pos-bg { background: var(--green-nitido) !important; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        .neg-bg { background: var(--red-nitido) !important; }
        .pos-txt { color: var(--green-nitido) !important; }
        .neg-txt { color: var(--red-nitido) !important; }
    </style>
</head>
<body>

<div class="st-bar" id="main-header">
    <div class="st-top-row">
        <div class="notif-bell" id="bell" onclick="toggleNotifs()">
            <span id="last-alert">FÊNIX PRIME // QUANTUM LOCK</span>
            <div class="bell-dot" id="dot"></div>
            <span style="font-size: 12px;">🔔</span>
        </div>
        <div class="clock-modern" id="clock">00:00:00</div>
    </div>
    <div class="st-metrics">
        <div class="stat-box"><span class="stat-label">Organismo</span><span class="stat-val pulse" id="mkt-status">MODO AUTÔNOMO</span></div>
        <div class="stat-box"><span class="stat-label">Domínio BTC</span><span class="stat-val" id="btc-dom">54.2%</span></div>
        <div class="stat-box"><span class="stat-label">Status Bot</span><span class="stat-val" id="bot-status-label" style="color: var(--green-nitido);">AUTÔNOMO</span></div>
        <div class="stat-box"><span class="stat-label">Alvos Ativos</span><span class="stat-val" id="target-count" style="color: var(--green-nitido);">0</span></div>
    </div>
</div>

<div id="notif-panel">
    <div class="notif-header">
        <span style="font-size: 11px; font-weight: 900;">HISTÓRICO QUÂNTICO & AUDITORIA</span>
        <div class="panel-actions">
            <button class="export-btn" onclick="exportAlerts()">EXPORTAR</button>
            <button class="clear-btn" onclick="clearAlerts()">LIMPAR</button>
            <span onclick="toggleNotifs()" style="cursor:pointer; font-size: 14px;">✕</span>
        </div>
    </div>
    <div id="notif-list"></div>
</div>

<div class="nav">
    <button class="n-btn active" id="btn-all" onclick="setFilter('ALL')">🔱 TODOS</button>
    <button class="n-btn" id="btn-targets" onclick="setFilter('TARGETS')">⚡ EM ALVO</button>
    <button class="n-btn" id="btn-top" onclick="setFilter('TOP')">📈 ALTAS</button>
    <button class="n-btn" id="btn-spread" onclick="setFilter('SPREAD')">🚀 SPREAD</button>
</div>

<div class="extra-controls">
    <div>
        <span>TEMA:</span> 
        <select id="theme-select" onchange="toggleTheme(this.value)">
            <option value="dark">DARK SUPREMO</option>
            <option value="light">LIGHT DIURNO</option>
        </select>
    </div>
    <div>
        <span>VOL MÍN:</span> 
        <select id="vol-filter" onchange="sync()">
            <option value="0">QUALQUER</option>
            <option value="50"> > 50M</option>
            <option value="100"> > 100M</option>
        </select>
    </div>
</div>

<div class="container" id="list"></div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    const coins = ["BTC", "ETH", "SOL", "LINK", "STX", "RENDER", "NEAR", "SEI", "ADA", "DOT", "FET"];
    const logoMap = {
        "BTC": "btc", "ETH": "eth", "SOL": "sol", "LINK": "link", "STX": "stx",
        "RENDER": "rndr", "NEAR": "near", "SEI": "sei", "ADA": "ada", "DOT": "dot", "FET": "fet"
    };

    const baseFallbackPrices = {
        "BTC": 350000.00, "ETH": 18000.00, "SOL": 850.00, "LINK": 95.00, 
        "STX": 12.00, "RENDER": 45.00, "NEAR": 25.00, "SEI": 2.50, 
        "ADA": 3.50, "DOT": 30.00, "FET": 7.00
    };

    let usdRate = 5.50;
    let currentFilter = 'ALL';
    let alerts = JSON.parse(localStorage.getItem('fenix_quantum_alerts_v6') || '[]');

    function toggleTheme(mode) {
        if(mode === 'light') {
            document.documentElement.style.setProperty('--bg', '#f4f4f4');
            document.documentElement.style.setProperty('--card', '#ffffff');
            document.documentElement.style.setProperty('--border-dark', '#ddd');
            document.documentElement.style.setProperty('--glass', 'rgba(240, 240, 240, 0.95)');
            document.body.style.color = '#111';
        } else {
            document.documentElement.style.setProperty('--bg', '#020202');
            document.documentElement.style.setProperty('--card', '#0a0a0a');
            document.documentElement.style.setProperty('--border-dark', '#1a1a1a');
            document.documentElement.style.setProperty('--glass', 'rgba(5, 5, 5, 0.95)');
            document.body.style.color = '#ffffff';
        }
    }

    function renderInitialCards() {
        const listContainer = document.getElementById('list');
        listContainer.innerHTML = '';
        coins.forEach((s, index) => {
            let card = document.createElement('div');
            card.id = `card-${s}`;
            card.className = `c-asset`;
            card.style.order = index;
            card.onclick = (e) => {
                if(!e.target.classList.contains('a-price')) toggle(s);
            };
            let initialPrice = baseFallbackPrices[s] || 100.00;
            card.innerHTML = `
                <div class="side-pill" id="pill-${s}"></div>
                <div class="asset-row">
                    <div class="a-left">
                        <img class="coin-icon" src="https://cryptologos.cc/logos/${logoMap[s]}-${s.toLowerCase()}-logo.png?v=025" onerror="this.src='https://ui-avatars.com/api/?name=${s}&background=111&color=fff'">
                        <div class="a-info">
                            <span class="a-sym">${s}</span>
                            <div class="a-subinfo">
                                <span class="a-pair" id="spread-${s}">SPREAD: 0.10%</span>
                                <span class="rsi-tag" id="rsi-${s}">RSI: 50</span>
                                <span class="vol-tag" id="vol-${s}">VOL: 10M</span>
                            </div>
                        </div>
                    </div>
                    <div class="a-right">
                        <div class="a-price" id="pr-${s}" onclick="copyPrice(${initialPrice}, '${s}')">R$ ${initialPrice.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                        <div class="status-box">
                            <span class="flow-tag" id="tag-${s}">AGUARDA</span>
                            <span class="a-pct" id="pct-${s}">+0.00%</span>
                        </div>
                    </div>
                </div>
                <div class="chart-box" id="tv-${s}"></div>
            `;
            listContainer.appendChild(card);
        });
    }

    function setFilter(filter) {
        currentFilter = filter;
        document.getElementById('btn-all').classList.toggle('active', filter === 'ALL');
        document.getElementById('btn-targets').classList.toggle('active', filter === 'TARGETS');
        document.getElementById('btn-top').classList.toggle('active', filter === 'TOP');
        document.getElementById('btn-spread').classList.toggle('active', filter === 'SPREAD');
        sync();
    }

    function toggleNotifs() {
        const panel = document.getElementById('notif-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        document.getElementById('dot').style.display = 'none';
    }

    function clearAlerts() {
        alerts = [];
        localStorage.removeItem('fenix_quantum_alerts_v6');
        renderAlerts();
        document.getElementById('last-alert').innerText = "FÊNIX PRIME // QUANTUM LOCK";
    }

    function exportAlerts() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(alerts, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "auditoria_fenix_quantum.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function addAlert(msg, triggerVibration = false) {
        const time = new Date().toLocaleTimeString();
        alerts.unshift(`[${time}] ${msg}`);
        if(alerts.length > 50) alerts.pop();
        localStorage.setItem('fenix_quantum_alerts_v6', JSON.stringify(alerts));
        renderAlerts();
        document.getElementById('dot').style.display = 'block';
        document.getElementById('last-alert').innerText = "ALERTA DE ALTA URGÊNCIA";
        
        if(triggerVibration && navigator.vibrate) {
            navigator.vibrate([200, 100, 200]);
        }
    }

    function renderAlerts() {
        const listEl = document.getElementById('notif-list');
        if(listEl) {
            listEl.innerHTML = alerts.length ? alerts.map(a => `<div class="notif-item">${a}</div>`).join('') : '<div class="notif-item">Nenhum registo quântico recente.</div>';
        }
    }
    renderAlerts();

    function copyPrice(val, symbol) {
        navigator.clipboard.writeText(val.toFixed(2));
        addAlert(`Preço copiado para ${symbol}: R$ ${val.toFixed(2)}`);
    }

    async function sync() {
        let dadosBot = {};
        let botOnline = false;

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            const resBot = await fetch('https://diplomata-gold-bot.onrender.com/api/dados', { method: 'GET', mode: 'cors', signal: controller.signal });
            clearTimeout(timeoutId);
            if (resBot.ok) {
                dadosBot = await resBot.json();
                if (dadosBot && Object.keys(dadosBot).length > 0) botOnline = true;
            }
        } catch (err) {}

        const botStatusEl = document.getElementById('bot-status-label');
        if (botOnline) {
            botStatusEl.innerText = "ONLINE";
            botStatusEl.style.color = "var(--green-nitido)";
        } else {
            botStatusEl.innerText = "AUTÔNOMO";
            botStatusEl.style.color = "var(--green-nitido)";
        }

        try {
            const controllerRate = new AbortController();
            const timeoutRate = setTimeout(() => controllerRate.abort(), 2000);
            const resRate = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTBRL', { signal: controllerRate.signal });
            clearTimeout(timeoutRate);
            const dRate = await resRate.json();
            usdRate = parseFloat(dRate.price);
        } catch (e) {}

        let assetData = [];
        let minVolFilter = parseFloat(document.getElementById('vol-filter').value) || 0;

        for (let s of coins) {
            let precoBaseLocal = baseFallbackPrices[s] || 100.00;
            try {
                const controllerCoin = new AbortController();
                const timeoutCoin = setTimeout(() => controllerCoin.abort(), 2000);
                const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${s}USDT`, { signal: controllerCoin.signal });
                clearTimeout(timeoutCoin);
                const data = await res.json();
                
                let variacaoOriginal = parseFloat(data.priceChangePercent || 0);
                let variacaoAjustada = variacaoOriginal * 0.50; 
                let precoBinance = parseFloat(data.lastPrice || 1);
                
                let precoBot = (dadosBot && dadosBot[s] !== undefined) ? dadosBot[s] : (precoBinance * (1 + (variacaoOriginal * 0.001)));
                
                let spreadCalculado = (((precoBot - precoBinance) / precoBinance) * 100).toFixed(2);
                let precoFinal = precoBot * usdRate;
                let spreadPressure = Math.abs(variacaoOriginal) > 4 ? "SUPREMO" : "ESTÁVEL";
                let isTarget = (s !== "BTC" && variacaoAjustada > 0.8 && spreadPressure === "SUPREMO");

                let rsiSimulado = Math.min(Math.max(50 + (variacaoOriginal * 2.5), 10), 99).toFixed(0);
                let quoteVolume = parseFloat(data.quoteVolume || 0);
                let volInMillions = quoteVolume / 1e6;
                let volFormatado = quoteVolume >= 1e9 ? (quoteVolume / 1e9).toFixed(1) + 'B' : volInMillions.toFixed(1) + 'M';

                assetData.push({
                    s, p: precoFinal, pct: variacaoAjustada, spread: parseFloat(spreadCalculado),
                    rsi: rsiSimulado, vol: volFormatado, volNum: volInMillions, pressure: spreadPressure, isTarget
                });
            } catch (err) {
                assetData.push({
                    s, p: precoBaseLocal, pct: 0.00, spread: 0.10, rsi: "50", vol: "5M", volNum: 5, pressure: "ESTÁVEL", isTarget: false
                });
            }
        }

        if (currentFilter === 'TOP') {
            assetData.sort((a, b) => b.pct - a.pct);
        } else if (currentFilter === 'SPREAD') {
            assetData.sort((a, b) => b.spread - a.spread);
        } else {
            assetData.sort((a, b) => b.p - a.p);
        }

        let activeTargetsCount = assetData.filter(a => a.isTarget).length;
        document.getElementById('target-count').innerText = activeTargetsCount;

        assetData.forEach((asset, index) => {
            let card = document.getElementById(`card-${asset.s}`);
            if (card) {
                card.style.order = index;

                let showCard = true;
                if (currentFilter === 'TARGETS' && !asset.isTarget) showCard = false;
                if (currentFilter === 'SPREAD' && asset.spread <= 0.1) showCard = false;
