<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL_V16 // RSI BLINDADO</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #010101; 
            --card: #060606; 
            --card-hover: #0b0b0b;
            --green-nitido: #00ff88; 
            --red-nitido: #ff3e3e;   
            --border-dark: #1a1a1a; 
            --border-glow: #2a2a2a;
            --glass: rgba(3, 3, 3, 0.98);
        }
        body { background: var(--bg); color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; }

        .st-bar { 
            display: flex; flex-direction: column;
            padding: 15px 20px; border-bottom: 2px solid var(--border-dark); 
            background: var(--glass); backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 1000;
        }
        
        .st-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .st-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; border-top: 1px solid #111; padding-top: 12px; }
        
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 7px; font-weight: 900; color: #555; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 3px; }
        .stat-val { font-size: 10px; font-weight: 800; font-family: 'JetBrains Mono', monospace; color: #ddd; }

        .clock-modern { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 16px; font-weight: 800; 
            color: #fff; text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            background: #0d0d0d; padding: 4px 10px; border-radius: 6px; border: 1px solid #1f1f1f;
        }

        .notif-bell { display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 900; color: #666; cursor: pointer; position: relative; }
        .bell-dot { width: 7px; height: 7px; background: #ffcc00; border-radius: 50%; position: absolute; top: -3px; right: -3px; display: none; box-shadow: 0 0 10px #ffcc00; }
        
        #notif-panel {
            position: fixed; top: 90px; right: 12px; left: 12px; 
            background: #0a0a0a; border: 1px solid #222; border-radius: 12px;
            padding: 18px; display: none; z-index: 2000; box-shadow: 0 30px 60px rgba(0,0,0,1);
        }
        .notif-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f1f1f; padding-bottom: 8px; margin-bottom: 8px; }
        .notif-item { font-size: 9px; font-family: 'JetBrains Mono', monospace; padding: 8px 0; border-bottom: 1px solid #141414; color: #999; }
        .clear-btn { background: #ff3e3e; color: #fff; border: none; padding: 3px 6px; font-size: 8px; font-weight: 900; border-radius: 4px; cursor: pointer; }

        .pulse { animation: pulse-glow 1.8s infinite ease-in-out; }
        @keyframes pulse-glow { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .quantum-panel-sugestoes {
            background: #050505;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            margin: 10px 12px;
            padding: 12px 15px;
            font-family: 'JetBrains Mono', monospace;
        }
        .qp-title { font-size: 9px; font-weight: 900; color: var(--green-nitido); margin-bottom: 6px; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .qp-grid { display: grid; grid-template-columns: 1fr; gap: 6px; font-size: 9px; color: #aaa; }
        .qp-val { color: #fff; font-weight: 800; display: inline-block; }
        
        .risk-manager-box {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #141414;
        }
        .risk-field { display: flex; flex-direction: column; gap: 2px; }
        .risk-label { font-size: 7px; color: #555; text-transform: uppercase; font-weight: 900; }
        .risk-input { background: #0c0c0c; border: 1px solid #222; color: var(--green-nitido); font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px; border-radius: 4px; outline: none; width: 100%; box-sizing: border-box; }

        .nav { display: flex; border-bottom: 1px solid var(--border-dark); background: #030303; flex-wrap: wrap; }
        .n-btn { flex: 1; min-width: 25%; padding: 12px; text-align: center; font-size: 8px; font-weight: 900; color: #444; background: none; border: none; letter-spacing: 1px; cursor: pointer; }
        .n-btn.active { color: var(--green-nitido); border-bottom: 3px solid var(--green-nitido); background: rgba(0,255,136,0.02); }

        .container { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
        
        .c-asset { 
            background: linear-gradient(135deg, var(--card) 0%, #030303 100%);
            border: 1px solid var(--border-dark);
            border-radius: 12px; 
            margin-bottom: 8px; 
            padding: 14px 16px; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .side-pill {
            position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
            background: #161616; transition: all 0.3s ease;
            box-shadow: 2px 0 8px rgba(0,0,0,0.5);
        }

        .asset-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .a-left { display: flex; align-items: center; gap: 12px; }
        
        .coin-icon { 
            width: 32px; height: 32px; border-radius: 50%; 
            background: #0d0d0d; border: 1px solid #222; 
            padding: 2px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        
        .a-info { display: flex; flex-direction: column; }
        .a-sym { font-size: 18px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; line-height: 1; }
        .a-subinfo { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
        .a-pair { font-size: 8px; color: #666; font-weight: 900; font-family: 'JetBrains Mono', monospace; background: #0c0c0c; padding: 2px 5px; border-radius: 4px; border: 1px solid #171717; }
        
        .hft-tag { font-size: 8px; font-weight: 900; font-family: 'JetBrains Mono', monospace; padding: 2px 6px; border-radius: 4px; border: 1px solid transparent; }
        .flow-buy { color: #00ff88; background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.2); }
        .rsi-tag { color: #f59e0b; background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.2); }

        .a-right { text-align: right; }
        .a-price { font-size: 18px; font-weight: 800; color: #ffffff; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: color 0.2s; }
        .a-price:hover { color: var(--green-nitido); }
        
        .status-box { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 5px; }
        .a-pct { font-size: 11px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
        
        .flow-tag { 
            font-size: 8px; font-weight: 900; padding: 2px 6px; 
            border-radius: 4px; background: #090909; 
            border: 1px solid #1f1f1f; color: #666; 
            letter-spacing: 0.5px;
        }

        .chart-box { display: none; width: 100%; height: 420px; margin-top: 14px; border-top: 1px solid var(--border-dark); padding-top: 4px; }
        .c-asset.open .chart-box { display: block; }

        .pos-bg { background: var(--green-nitido) !important; box-shadow: 0 0 12px rgba(0, 255, 136, 0.3); }
        .neg-bg { background: var(--red-nitido) !important; box-shadow: 0 0 12px rgba(255, 62, 62, 0.3); }
        .pos-txt { color: var(--green-nitido) !important; }
        .neg-txt { color: var(--red-nitido) !important; }
    </style>
</head>
<body>

<div class="st-bar" id="main-header">
    <div class="st-top-row">
        <div class="notif-bell" id="bell" onclick="toggleNotifs()">
            <span id="last-alert">SENTINEL_V16 // ATIVO</span>
            <div class="bell-dot" id="dot"></div>
            <span style="font-size: 11px;">🔔</span>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button onclick="location.reload(true)" style="background: #111; border: 1px solid #333; color: #00ff88; font-size: 8px; font-weight: 900; padding: 6px 8px; border-radius: 4px; cursor: pointer;">🔄 RECARREGAR</button>
            <div class="clock-modern" id="clock">00:00:00</div>
        </div>
    </div>
    <div class="st-metrics">
        <div class="stat-box"><span class="stat-label">Modo</span><span class="stat-val pulse" id="mkt-status">HFT SUPREMO</span></div>
        <div class="stat-box"><span class="stat-label">Latência</span><span class="stat-val" id="latency-val" style="color: var(--green-nitido);">8ms</span></div>
        <div class="stat-box"><span class="stat-label">Métrica</span><span class="stat-val" id="stake-mode-label" style="color: #f59e0b;">RSI ATIVO</span></div>
        <div class="stat-box"><span class="stat-label">Alvos</span><span class="stat-val" id="target-count" style="color: var(--green-nitido);">0</span></div>
    </div>
</div>

<div class="quantum-panel-sugestoes">
    <div class="qp-title">
        <span>⚡ STATUS & GESTÃO DE RISCO DINÂMICO</span>
        <span id="risk-suggestion" style="font-size: 8px; color: #f59e0b;">STAKE SUGERIDA: R$ 1,00</span>
    </div>
    <div class="qp-grid">
        <div>Motor: <span class="qp-val" id="status-carregamento" style="color: var(--green-nitido);">Monitoramento RSI, SPREAD & Alerta Sonoro Ativo</span></div>
    </div>
    <div class="risk-manager-box">
        <div class="risk-field">
            <span class="risk-label">Banca Base (R$)</span>
            <input type="number" id="input-banca" class="risk-input" value="100" oninput="calcularRisco()">
        </div>
        <div class="risk-field">
            <span class="risk-label">Risco/Round (%)</span>
            <input type="number" id="input-risco" class="risk-input" value="1" step="0.1" oninput="calcularRisco()">
        </div>
        <div class="risk-field">
            <span class="risk-label">Stake Calculada</span>
            <input type="text" id="output-stake" class="risk-input" value="R$ 1,00" readonly style="color: #00ff88; font-weight: 900;">
        </div>
    </div>
</div>

<div id="notif-panel">
    <div class="notif-header">
        <span style="font-size: 10px; font-weight: 900;">REGISTRO DE EVENTOS</span>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button class="clear-btn" onclick="clearAlerts()">LIMPAR</button>
            <span onclick="toggleNotifs()" style="cursor:pointer; font-size: 14px;">✕</span>
        </div>
    </div>
    <div id="notif-list"></div>
</div>

<div class="nav">
    <button class="n-btn active" id="btn-all" onclick="setFilter('ALL')">🔱 TODOS</button>
    <button class="n-btn" id="btn-targets" onclick="setFilter('TARGETS')">⚡ EM ALVO</button>
    <button class="n-btn" id="btn-top" onclick="setFilter('TOP')">📈 ALTAS</button>
    <button class="n-btn" id="btn-spread" onclick="setFilter('SPREAD')">🚀 SPREAD</button>
</div>

<div class="container" id="list">
    <!-- Lista gerada dinamicamente para evitar qualquer falha de elementos em falta -->
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    const coinsDataConfig = [
        { s: "BTC", name: "Bitcoin", icon: "bitcoin-btc-logo.png", base: 375000.0, spread: 0.30 },
        { s: "ETH", name: "Ethereum", icon: "ethereum-eth-logo.png", base: 18500.0, spread: 0.34 },
        { s: "SOL", name: "Solana", icon: "solana-sol-logo.png", base: 850.0, spread: 0.38 },
        { s: "LINK", name: "Chainlink", icon: "chainlink-link-logo.png", base: 75.0, spread: 0.42 },
        { s: "STX", name: "Stacks", icon: "stacks-stx-logo.png", base: 12.50, spread: 0.46 },
        { s: "RENDER", name: "Render", icon: "render-token-rndr-logo.png", base: 45.0, spread: 0.50 },
        { s: "NEAR", name: "Near", icon: "near-protocol-near-logo.png", base: 24.0, spread: 0.54 },
        { s: "SEI", name: "Sei", icon: "sei-sei-logo.png", base: 2.50, spread: 0.58 },
        { s: "ADA", name: "Cardano", icon: "cardano-ada-logo.png", base: 3.20, spread: 0.62 },
        { s: "DOT", name: "Polkadot", icon: "polkadot-new-dot-logo.png", base: 22.0, spread: 0.66 },
        { s: "FET", name: "Fetch.ai", icon: "fetch-ai-fet-logo.png", base: 8.50, spread: 0.70 }
    ];

    let basePrices = {};
    coinsDataConfig.forEach(c => basePrices[c.s] = c.base);

    let currentFilter = localStorage.getItem('sentinel_filter_v16') || 'ALL';
    let alerts = JSON.parse(localStorage.getItem('fenix_quantum_alerts_v16') || '[]');
    let audioCtx = null;

    function buildUI() {
        const listContainer = document.getElementById('list');
        let html = '';
        coinsDataConfig.forEach(coin => {
            html += `
            <div class="c-asset" id="card-${coin.s}" onclick="if(!event.target.classList.contains('a-price')) toggle('${coin.s}')">
                <div class="side-pill pos-bg" id="pill-${coin.s}"></div>
                <div class="asset-row">
                    <div class="a-left">
                        <img class="coin-icon" src="https://cryptologos.cc/logos/${coin.icon}?v=025" onerror="this.src='https://ui-avatars.com/api/?name=${coin.s}&background=111&color=fff'">
                        <div class="a-info">
                            <span class="a-sym">${coin.s}</span>
                            <div class="a-subinfo">
                                <span class="a-pair" id="spread-${coin.s}">SPREAD: ${coin.spread.toFixed(2)}%</span>
                                <span class="hft-tag flow-buy" id="flow-${coin.s}">DELTA: +1.2%</span>
                                <span class="hft-tag rsi-tag" id="rsi-${coin.s}">RSI: 50.0</span>
                            </div>
                        </div>
                    </div>
                    <div class="a-right">
                        <div class="a-price" id="pr-${coin.s}">R$ 0,00</div>
                        <div class="status-box">
                            <span class="flow-tag" id="tag-${coin.s}">AGUARDA</span>
                            <span class="a-pct pos-txt" id="pct-${coin.s}">+0.00%</span>
                        </div>
                    </div>
                </div>
                <div class="chart-box" id="tv-${coin.s}"></div>
            </div>`;
        });
        listContainer.innerHTML = html;
    }

    buildUI();
    setFilter(currentFilter, false);
    sync();

    function playBeep() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) {}
    }

    function calcularRisco() {
        let banca = parseFloat(document.getElementById('input-banca').value) || 0;
        let percent = parseFloat(document.getElementById('input-risco').value) || 0;
        let stake = banca * (percent / 100);
        document.getElementById('output-stake').value = "R$ " + stake.toFixed(2);
        document.getElementById('risk-suggestion').innerText = `STAKE SUGERIDA: R$ ${stake.toFixed(2)}`;
    }

    function setFilter(filter, save = true) {
        currentFilter = filter;
        if (save) localStorage.setItem('sentinel_filter_v16', filter);
        document.getElementById('btn-all').classList.toggle('active', filter === 'ALL');
        document.getElementById('btn-targets').classList.toggle('active', filter === 'TARGETS');
        document.getElementById('btn-top').classList.toggle('active', filter === 'TOP');
        document.getElementById('btn-spread').classList.toggle('active', filter === 'SPREAD');
        sync();
    }

    function toggleNotifs() {
        const panel = document.getElementById('notif-panel');
        if(panel) {
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            let dot = document.getElementById('dot');
            if(dot) dot.style.display = 'none';
        }
    }

    function clearAlerts() {
        alerts = [];
        localStorage.removeItem('fenix_quantum_alerts_v16');
        renderAlerts();
    }

    function addAlert(msg) {
        const time = new Date().toLocaleTimeString();
        alerts.unshift(`[${time}] ${msg}`);
        if(alerts.length > 30) alerts.pop();
        localStorage.setItem('fenix_quantum_alerts_v16', JSON.stringify(alerts));
        renderAlerts();
        let dot = document.getElementById('dot');
        if(dot) dot.style.display = 'block';
        playBeep();
    }

    function renderAlerts() {
        const listEl = document.getElementById('notif-list');
        if(listEl) {
            listEl.innerHTML = alerts.length ? alerts.map(a => `<div class="notif-item">${a}</div>`).join('') : '<div class="notif-item">Sem eventos recentes.</div>';
        }
    }
    renderAlerts();

    function copyPrice(val, symbol) {
        navigator.clipboard.writeText(val.toFixed(2));
        addAlert(`Copiado [${symbol}]: R$ ${val.toFixed(2)}`);
    }

    function sync() {
        let assetData = [];

        coinsDataConfig.forEach((coin, i) => {
            let s = coin.s;
            let variacaoAleatoria = (Math.random() * 2.4) - 1.1; 
            basePrices[s] = basePrices[s] * (1 + (variacaoAleatoria / 100));
            
            let priceBRL = basePrices[s];
            let priceChange = parseFloat(variacaoAleatoria.toFixed(2));
            let rsiCalculado = Math.min(95, Math.max(15, 50 + (priceChange * 12) + ((i % 3) * 3)));
            let isTarget = (s !== "BTC" && priceChange > 0.3 && rsiCalculado > 52);

            assetData.push({
                s, p: priceBRL, pct: priceChange, spread: coin.spread, rsi: rsiCalculado, isTarget
            });
        });

        assetData.forEach((asset, index) => {
            let card = document.getElementById(`card-${asset.s}`);
            if (card) {
                card.style.order = index;
                let showCard = true;
                if (currentFilter === 'TARGETS' && !asset.isTarget) showCard = false;
                if (currentFilter === 'SPREAD' && asset.spread <= 0.1) showCard = false;
                card.style.display = showCard ? 'flex' : 'none';

                const isPos = asset.pct >= 0;
                let pill = document.getElementById(`pill-${asset.s}`);
                if(pill) pill.className = `side-pill ${isPos ? 'pos-bg' : 'neg-bg'}`;
                
                const priceEl = document.getElementById(`pr-${asset.s}`);
                if(priceEl) {
                    priceEl.innerText = "R$ " + asset.p.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    priceEl.setAttribute('onclick', `copyPrice(${asset.p}, '${asset.s}')`);
                }

                let spreadEl = document.getElementById(`spread-${asset.s}`);
                if(spreadEl) spreadEl.innerText = `SPREAD: ${asset.spread.
