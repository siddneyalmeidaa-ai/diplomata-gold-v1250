<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle e Monitoramento</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
        }
        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 14px;
        }
        button {
            background-color: var(--accent-color);
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #111827;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active { background-color: var(--success-color); color: #fff; }
        .status-inactive { background-color: var(--danger-color); color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Painel de Monitoramento</h1>
            <div id="datetime">21/09/2026 06:30</div>
        </header>

        <!-- Painel de Controle Visual & Filtro de Volatilidade -->
        <div class="panel">
            <h2>Painel de Controle e Filtros</h2>
            <div class="controls-grid">
                <div>
                    <label for="volatilityFilter">Filtro de Volatilidade</label>
                    <select id="volatilityFilter" onchange="saveSettings()">
                        <option value="all">Todas as Volatilidades</option>
                        <option value="low">Baixa Volatilidade</option>
                        <option value="medium">Média Volatilidade</option>
                        <option value="high">Alta Volatilidade</option>
                    </select>
                </div>
                <div>
                    <label for="soundAlerts">Alertas Sonoros</label>
                    <select id="soundAlerts" onchange="saveSettings()">
                        <option value="on">Ativado</option>
                        <option value="off">Desativado</option>
                    </select>
                </div>
                <div>
                    <label for="autoRefresh">Atualização Automática</label>
                    <select id="autoRefresh" onchange="saveSettings()">
                        <option value="5">A cada 5 segundos</option>
                        <option value="10">A cada 10 segundos</option>
                        <option value="30">A cada 30 segundos</option>
                    </select>
                </div>
            </div>
            <button onclick="testAlert()">Testar Alerta Sonoro</button>
        </div>

        <!-- Tabela de Dados Persistentes e Monitorados -->
        <div class="panel">
            <h2>Dados Monitorados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID / Ativo</th>
                        <th>Volatilidade</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    <tr>
                        <td>Ativo 01</td>
                        <td>Alta</td>
                        <td><span class="status-badge status-active">Ativo</span></td>
                        <td>Monitorando</td>
                    </tr>
                    <tr>
                        <td>Ativo 02</td>
                        <td>Baixa</td>
                        <td><span class="status-badge status-inactive">Pausado</span></td>
                        <td>Aguardando</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. Persistência de Estado no Navegador (localStorage)
        function saveSettings() {
            const volatility = document.getElementById('volatilityFilter').value;
            const sound = document.getElementById('soundAlerts').value;
            const refresh = document.getElementById('autoRefresh').value;

            localStorage.setItem('volatilityFilter', volatility);
            localStorage.setItem('soundAlerts', sound);
            localStorage.setItem('autoRefresh', refresh);
            
            applyFilters();
        }

        function loadSettings() {
            if (localStorage.getItem('volatilityFilter')) {
                document.getElementById('volatilityFilter').value = localStorage.getItem('volatilityFilter');
            }
            if (localStorage.getItem('soundAlerts')) {
                document.getElementById('soundAlerts').value = localStorage.getItem('soundAlerts');
            }
            if (localStorage.getItem('autoRefresh')) {
                document.getElementById('autoRefresh').value = localStorage.getItem('autoRefresh');
            }
            applyFilters();
        }

        // 2. Alertas Sonoros (Web Audio API)
        function playSoundAlert() {
            const soundSetting = document.getElementById('soundAlerts').value;
            if (soundSetting !== 'on') return;

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                console.log("Áudio não suportado ou bloqueado pelo navegador.");
            }
        }

        function testAlert() {
            playSoundAlert();
        }

        // 3. Filtro de Volatilidade
        function applyFilters() {
            const selectedVolatility = document.getElementById('volatilityFilter').value;
            const rows = document.querySelectorAll('#dataTable tr');

            rows.forEach(row => {
                const volatilityText = row.cells[1].textContent.toLowerCase();
                if (selectedVolatility === 'all') {
                    row.style.display = '';
                } else if (selectedVolatility === 'high' && volatilityText.includes('alta')) {
                    row.style.display = '';
                } else if (selectedVolatility === 'low' && volatilityText.includes('baixa')) {
                    row.style.display = '';
                } else if (selectedVolatility === 'medium' && volatilityText.includes('média')) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Inicialização ao carregar a página
        window.onload = function() {
            loadSettings();
        };
    </script>
</body>
</html>
