<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel - Terminal Institucional</title>
    <style>
        :root {
            --bg-color: #0b0e11;
            --card-bg: #151a21;
            --text-main: #eaecef;
            --text-secondary: #848e9c;
            --green: #0ecb81;
            --red: #f6465d;
            --yellow: #f0b90b;
            --border: #2b313a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .header-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-secondary);
        }

        .header-timer {
            font-size: 16px;
            font-weight: bold;
            color: var(--green);
        }

        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .metric-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 14px;
            font-weight: bold;
            margin-top: 4px;
            color: var(--yellow);
        }

        .coins-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .coin-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .coin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .coin-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .coin-name {
            font-size: 16px;
            font-weight: bold;
        }

        .coin-details {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .coin-price-box {
            text-align: right;
        }

        .coin-price {
            font-size: 15px;
            font-weight: bold;
        }

        .coin-status {
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
        }

        .status-entra {
            background: rgba(14, 203, 129, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .status-pula {
            background: rgba(246, 70, 93, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }

        .status-lateral {
            background: rgba(240, 185, 11, 0.15);
            color: var(--yellow);
            border: 1px solid var(--yellow);
        }
    </style>
</head>
<body>

    <header>
        <span class="header-title">SENTINEL // 14 ATIVOS</span>
        <span class="header-timer" id="timer">00:00:01</span>
    </header>

    <div class="metrics-bar">
        <div class="metric-card">
            <div class="metric-label">MODO</div>
            <div class="metric-value">SMART</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">MÉTRICA</div>
            <div class="metric-value">RSI AUTÓNOMO</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">ALVOS</div>
            <div class="metric-value" id="total-alvos">0</div>
        </div>
    </div>

    <div class="coins-container" id="lista-ativos">
        <!-- Dados carregados da API -->
    </div>

    <script>
        const iconesAtivos = {
            "BTC": "https://assets.coincap.io/assets/icons/btc@2x.png",
            "ETH": "https://assets.coincap.io/assets/icons/eth@2x.png",
            "SOL": "https://assets.coincap.io/assets/icons/sol@2x.png",
            "LINK": "https://assets.coincap.io/assets/icons/link@2x.png",
            "NEAR": "https://assets.coincap.io/assets/icons/near@2x.png",
            "RENDER": "https://assets.coincap.io/assets/icons/render-token@2x.png",
            "DOT": "https://assets.coincap.io/assets/icons/dot@2x.png",
            "STX": "https://assets.coincap.io/assets/icons/stx@2x.png",
            "ADA": "https://assets.coincap.io/assets/icons/ada@2x.png",
            "XRP": "https://assets.coincap.io/assets/icons/xrp@2x.png",
            "AVAX": "https://assets.coincap.io/assets/icons/avax@2x.png",
            "DOGE": "https://assets.coincap.io/assets/icons/doge@2x.png",
            "POL": "https://assets.coincap.io/assets/icons/pol@2x.png",
            "UNI": "https://assets.coincap.io/assets/icons/uni@2x.png"
        };

        let segundosDecorridos = 0;
        setInterval(() => {
            segundosDecorridos++;
            let h = Math.floor(segundosDecorridos / 3600).toString().padStart(2, '0');
            let m = Math.floor((segundosDecorridos % 3600) / 60).toString().padStart(2, '0');
            let s = (segundosDecorridos % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
        }, 1000);

        async function atualizarDados() {
            try {
                let response = await fetch('/api/dados');
                if (!response.ok) return;
                let dados = await response.json();

                let container = document.getElementById('lista-ativos');
                container.innerHTML = '';
                
                let totalAlvos = 0;

                for (let simbolo in dados) {
                    let info = dados[simbolo];
                    let preco = info.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    let variacao = info.variacao;
                    let rsi = info.rsi.toFixed(1);
                    let estadoServidor = info.estado; 

                    if (estadoServidor && estadoServidor.includes("ENTRA")) {
                        totalAlvos++;
                    }

                    let classeStatus = "status-lateral";
                    if (estadoServidor && estadoServidor.includes("ENTRA")) classeStatus = "status-entra";
                    else if (estadoServidor && estadoServidor.includes("PULA")) classeStatus = "status-pula";

                    let varTexto = (variacao >= 0 ? "+" : "") + variacao.toFixed(2) + "%";

                    let htmlCard = `
                        <div class="coin-card">
                            <div class="coin-info">
                                <img src="${iconesAtivos[simbolo] || ''}" class="coin-icon" alt="${simbolo}">
                                <div>
                                    <div class="coin-name">${simbolo}</div>
                                    <div class="coin-details">SPREAD: ${varTexto} | RSI: ${rsi}</div>
                                </div>
                            </div>
                            <div class="coin-price-box">
                                <div class="coin-price">${preco}</div>
                                <div class="coin-status ${classeStatus}">${estadoServidor || 'AGUARDA'}</div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += htmlCard;
                }

                document.getElementById('total-alvos').innerText = totalAlvos;

            } catch (e) {
                console.error("Erro ao carregar dados:", e);
            }
        }

        setInterval(atualizarDados, 5000);
        atualizarDados();
    </script>
</body>
</html>
